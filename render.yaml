# Render Blueprint: one free web service running FalkorDB and the app in a single container.
services:
  - type: web
    name: desire-paths
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ALLOW_WRITE_ACTIONS
        value: "0"
      - key: LLM_PROVIDER
        value: sarvam
      - key: SARVAM_MODEL
        value: glm5.3
      - key: SARVAM_API_KEY
        sync: false
